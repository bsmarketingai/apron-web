<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="64" role="img" aria-label="Zubatá hrana pily s odlétajícími pilinami" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- APRON – animovaná hrana pily. Zuby: 16 px nahoře, pod nimi 48 px prostor pro piliny (průhledný). -->
  <style>
    .saw{animation:saw .42s cubic-bezier(.6,0,.4,1) infinite alternate}
    @keyframes saw{from{transform:translateX(0)}to{transform:translateX(48px)}}
    @media (prefers-reduced-motion:reduce){.saw{animation:none}.dust{display:none}}
  </style>
  <defs>
    <pattern id="tooth" width="24" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0H24L0 16Z" fill="#202020"/>
    </pattern>
  </defs>
  <g class="saw">
    <rect x="-96" y="0" width="100%" height="16" fill="url(#tooth)"/>
    <rect x="0" y="0" width="100%" height="16" fill="url(#tooth)"/>
  </g>
  <svg class="dust" x="44%" y="15" overflow="visible">
